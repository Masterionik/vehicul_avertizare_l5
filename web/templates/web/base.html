{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}Proximity and Impact Warning{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'web/css/app.css' %}">
</head>
<body data-page="{{ page }}">
  <header class="topbar">
    <div class="brand"><span class="brand-mark">P</span> Proximity and Impact Warning</div>
    <nav class="nav" aria-label="Main navigation">
      <a href="{% url 'web:index' %}" data-nav="dashboard">Dashboard</a>
      <a href="{% url 'web:devices' %}" data-nav="devices">Devices</a>
      <a href="{% url 'web:simulation' %}" data-nav="simulation">Simulation</a>
      <a href="{% url 'web:tests' %}" data-nav="tests">Tests</a>
    </nav>
    <div class="chips">
      <span class="badge badge-sim" id="badge-sim" hidden>SIMULATION</span>
      <span class="chip" id="chip-mesh">LoRa Meshtastic: --</span>
      <span class="chip" id="chip-zigbee">Zigbee: --</span>
      <button type="button" class="btn btn-stop" id="stop-all">Stop all</button>
    </div>
  </header>
  <main class="content">{% block content %}{% endblock %}</main>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="{% static 'web/js/app.js' %}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
