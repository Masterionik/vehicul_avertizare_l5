{% extends 'web/base.html' %}
{% load static %}
{% block title %}Devices | Proximity and Impact Warning{% endblock %}
{% block content %}
<section class="grid">
  <article class="card card-wide">
    <h2>Pi radios</h2>
    <div id="radios" class="rows"></div>
    <button type="button" class="btn" id="mesh-test">Send Meshtastic test message</button>
  </article>

  <article class="card card-wide">
    <h2>Remote vehicles (extra boards)</h2>
    <div id="vehicles" class="rows"></div>
  </article>

  <article class="card card-wide">
    <h2>Saved devices</h2>
    <div class="toolbar">
      <button type="button" class="btn" id="scan">Scan USB</button>
      <input id="tcp-host" placeholder="TCP host, e.g. 192.168.1.50" aria-label="TCP host">
      <input id="tcp-port" value="4403" size="5" aria-label="TCP port">
      <button type="button" class="btn" id="tcp-add">Add TCP device</button>
    </div>
    <div id="devices" class="rows"></div>
  </article>

  <article class="card card-wide">
    <h2>Device log</h2>
    <ul class="log" id="device-log"></ul>
  </article>
</section>
{% endblock %}
{% block scripts %}<script src="{% static 'web/js/devices.js' %}"></script>{% endblock %}
